name: Montar aplicativo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  montar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Montar o APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Dar nome ao arquivo
        run: cp app/build/outputs/apk/release/app-release.apk papelaria.apk

      - name: Publicar para baixar no celular
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Versão ${{ github.run_number }}
          files: papelaria.apk
          make_latest: true
